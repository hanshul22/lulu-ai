[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lulu-ai"
version = "1.0.7"
description = "AI-powered screen assistant — solves MCQs, generates and auto-types code/theory answers using global hotkeys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "blackfier", email = "blackfier19@gmail.com" }
]
keywords = ["ai", "assistant", "gemini", "automation", "hotkeys", "mcq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pynput>=1.7",
    "google-genai>=1.0",
    "Pillow>=10.0",
    "pyautogui>=0.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "customtkinter>=5.2",
]

[project.scripts]
lulu = "lulu_cli:main"

[tool.setuptools]
py-modules = ["lulu_cli", "lifecycle"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."